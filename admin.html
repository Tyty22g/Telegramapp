<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة</title>
<style>
:root{--bg:#10151c;--s:#1a222d;--s2:#232e3c;--t:#eef2f6;--h:#8b9aa8;--a:#3fa9f5;--err:#ef6b6b;--ok:#4cc38a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:20px}h2{font-size:16px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card{background:var(--s);border-radius:14px;padding:16px;margin-bottom:14px}
.hint{font-size:13px;color:var(--h)}
label{display:block;font-size:13px;color:var(--h);margin:10px 0 4px}
input,textarea{width:100%;background:var(--s2);color:var(--t);border:1px solid transparent;border-radius:10px;padding:11px;font:inherit;font-size:15px}
input:focus,textarea:focus{outline:none;border-color:var(--a)}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.ltr{direction:ltr;text-align:left}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:var(--a);color:#fff;cursor:pointer}
button.sec{background:var(--s2);color:var(--t)}button.del{background:transparent;color:var(--err)}
button:disabled{opacity:.5}.full{width:100%;margin-top:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:var(--s);color:var(--h);padding:10px 4px}
.tabs button.on{background:var(--a);color:#fff}
.item{background:var(--s2);border-radius:10px;padding:10px;margin-top:8px}
.item .k{font-weight:700}.item .u{font-size:12px;color:var(--h);word-break:break-all;direction:ltr;text-align:left}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{padding:7px 10px;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);padding:10px 18px;border-radius:10px;font-size:14px;max-width:90%;box-shadow:0 4px 18px #0008}
#toast.bad{color:var(--err)}[hidden]{display:none!important}
</style>
</head>
<body>

<!-- ============ شاشة التسجيل ============ -->
<section id="setup" hidden>
  <h1>تسجيل الدخول</h1>
  <p class="hint" style="margin:6px 0 14px">البيانات تُحفظ في متصفحك فقط ولا تُرفع إلى GitHub.</p>
  <div class="card">
    <label>اسم المستخدم في GitHub</label><input id="f-owner" class="ltr" autocapitalize="off">
    <label>اسم المستودع (Repository)</label><input id="f-repo" class="ltr" autocapitalize="off">
    <label>الفرع (Branch)</label><input id="f-branch" class="ltr" value="main">
    <label>توكن GitHub</label><input id="f-token" class="ltr" type="password" autocomplete="off">
    <p class="hint" style="margin-top:6px">Fine-grained token لهذا المستودع فقط، بصلاحية Contents: Read and write.</p>
    <label>يوزر البوت (بدون @)</label><input id="f-bot" class="ltr" autocapitalize="off">
    <label>الاسم المختصر للتطبيق (من BotFather)</label><input id="f-app" class="ltr" autocapitalize="off">
    <button class="full" id="b-login">تحقق وادخل</button>
  </div>
</section>

<!-- ============ اللوحة ============ -->
<section id="panel" hidden>
  <div class="top"><h1>لوحة الإدارة</h1><button class="sec" id="b-out">خروج</button></div>
  <div class="tabs">
    <button data-t="links" class="on">الروابط</button><button data-t="ads">الإعلانات</button><button data-t="files">الملفات</button>
  </div>

  <div id="t-links">
    <div class="card">
      <h2>إضافة رابط</h2>
      <label>المفتاح (اتركه فارغاً للتوليد التلقائي)</label><input id="l-key" class="ltr" autocapitalize="off">
      <label>الرابط الأصلي</label><input id="l-url" class="ltr" placeholder="https://" autocapitalize="off">
      <button class="full" id="b-addlink">حفظ الرابط</button>
    </div>
    <div class="card"><h2>الروابط الحالية</h2><div id="list"></div></div>
  </div>

  <div id="t-ads" hidden>
    <div class="card">
      <h2>إعدادات صفحة الانتظار</h2>
      <label>العنوان</label><input id="a-title">
      <label>مدة العداد (ثانية)</label><input id="a-sec" type="number" min="1" max="60" class="ltr">
      <label>كود الإعلان (Monetag أو أي شبكة)</label><textarea id="a-code" class="ltr" spellcheck="false" placeholder="<script src=...></script>"></textarea>
      <button class="full" id="b-saveads">حفظ ونشر</button>
      <p class="hint" style="margin-top:8px">يظهر التغيير بعد دقيقة تقريباً (وقت نشر Cloudflare).</p>
    </div>
  </div>

  <div id="t-files" hidden>
    <div class="card">
      <h2>رفع أو إنشاء ملف</h2>
      <label>المسار داخل المستودع (مثل images/logo.png)</label><input id="x-path" class="ltr" autocapitalize="off">
      <label>اختر ملفاً للرفع</label><input id="x-file" type="file">
      <label>أو اكتب محتوى ملف نصي</label><textarea id="x-text" class="ltr" spellcheck="false"></textarea>
      <button class="full" id="b-upload">رفع إلى GitHub</button>
    </div>
    <div class="card"><h2>ملفات المستودع</h2><div id="files"></div>
      <button class="sec full" id="b-restore">استعادة index.html الأصلي</button></div>
  </div>
</section>

<div id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LS = 'tgshort_admin';
const PROTECTED = ['index.html', 'admin.html'];
let cfg = JSON.parse(localStorage.getItem(LS) || 'null');
let links = {};
let site = { title: 'جاري تحضير الرابط', seconds: 10, adCode: '' };

// ---------- أدوات ----------
let tt;
function toast(m, bad) {
  const t = $('#toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500);
}
const enc = s => { let r = ''; for (const c of new TextEncoder().encode(s)) r += String.fromCharCode(c); return btoa(r); };
const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0)));
const readB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
const enp = p => p.split('/').map(encodeURIComponent).join('/');

async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message || 'حدث خطأ', true); }
  btn.disabled = false;
}

// ---------- GitHub API ----------
async function gh(path, opt = {}, c = cfg) {
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/${path}`, {
    ...opt,
    headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    const err = new Error(e.message || 'HTTP ' + r.status); err.status = r.status; throw err;
  }
  return r.json();
}
async function getFile(p) {
  try { return await gh(`contents/${enp(p)}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`); }
  catch (e) { if (e.status === 404) return null; throw e; }
}
async function putFile(p, b64, msg) {
  const f = await getFile(p);
  await gh(`contents/${enp(p)}`, { method: 'PUT', body: JSON.stringify({ message: msg, content: b64, branch: cfg.branch, ...(f ? { sha: f.sha } : {}) }) });
}
const putText = (p, text, msg) => putFile(p, enc(text), msg);

// ---------- التسجيل ----------
$('#b-login').onclick = e => busy(e.target, async () => {
  const c = {
    owner: $('#f-owner').value.trim(), repo: $('#f-repo').value.trim(),
    branch: $('#f-branch').value.trim() || 'main', token: $('#f-token').value.trim(),
    bot: $('#f-bot').value.trim().replace(/^@/, ''), app: $('#f-app').value.trim()
  };
  if (!c.owner || !c.repo || !c.token) throw new Error('أكمل اسم المستخدم والمستودع والتوكن');
  const info = await gh('', {}, c);
  if (info.permissions && !info.permissions.push) throw new Error('التوكن لا يملك صلاحية الكتابة');
  cfg = c; localStorage.setItem(LS, JSON.stringify(c));
  await start();
});
$('#b-out').onclick = () => { if (confirm('تسجيل الخروج ومسح البيانات من هذا المتصفح؟')) { localStorage.removeItem(LS); location.reload(); } };

// ---------- التبويبات ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['links', 'ads', 'files'].forEach(t => $('#t-' + t).hidden = t !== b.dataset.t);
  if (b.dataset.t === 'files') listFiles();
});

// ---------- الروابط ----------
const tlink = k => cfg.bot && cfg.app ? `https://t.me/${cfg.bot}/${cfg.app}?startapp=${k}` : `${location.origin}/?startapp=${k}`;
const rnd = () => Math.random().toString(36).slice(2, 8);

function renderLinks() {
  const box = $('#list'); box.textContent = '';
  const keys = Object.keys(links);
  if (!keys.length) { box.textContent = 'لا توجد روابط بعد.'; box.className = 'hint'; return; }
  keys.forEach(k => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<div class="k"></div><div class="u"></div><div class="acts"><button class="sec" data-a="c">نسخ رابط البوت</button><button class="sec" data-a="e">تعديل</button><button class="del" data-a="d">حذف</button></div>';
    d.querySelector('.k').textContent = k; d.querySelector('.u').textContent = links[k];
    d.querySelector('.acts').onclick = async ev => {
      const a = ev.target.dataset.a; if (!a) return;
      if (a === 'c') { try { await navigator.clipboard.writeText(tlink(k)); toast('تم النسخ'); } catch (_) { prompt('انسخ الرابط:', tlink(k)); } }
      if (a === 'e') { $('#l-key').value = k; $('#l-url').value = links[k]; window.scrollTo({ top: 0, behavior: 'smooth' }); }
      if (a === 'd' && confirm('حذف الرابط ' + k + '؟')) busy(ev.target, async () => { const n = { ...links }; delete n[k]; await saveLinks(n); toast('تم الحذف'); });
    };
    box.appendChild(d);
  });
}
async function saveLinks(n) {
  await putText('links.json', JSON.stringify(n, null, 2) + '\n', 'Update links');
  links = n; renderLinks();
}
$('#b-addlink').onclick = e => busy(e.target, async () => {
  const key = $('#l-key').value.trim() || rnd(), url = $('#l-url').value.trim();
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(key)) throw new Error('المفتاح: حروف إنجليزية وأرقام و _ و - فقط');
  if (!/^https?:\/\//i.test(url)) throw new Error('الرابط يجب أن يبدأ بـ http أو https');
  await saveLinks({ ...links, [key]: url });
  $('#l-key').value = ''; $('#l-url').value = '';
  toast('تم الحفظ — رابط البوت: ' + tlink(key));
});

// ---------- الإعلانات ----------
$('#b-saveads').onclick = e => busy(e.target, async () => {
  const s = { title: $('#a-title').value.trim() || 'جاري تحضير الرابط', seconds: Math.min(60, Math.max(1, +$('#a-sec').value || 10)), adCode: $('#a-code').value };
  await putText('config.json', JSON.stringify(s, null, 2) + '\n', 'Update ads config');
  site = s; toast('تم الحفظ والنشر');
});

// ---------- الملفات ----------
$('#b-upload').onclick = e => busy(e.target, async () => {
  const f = $('#x-file').files[0], text = $('#x-text').value;
  let path = $('#x-path').value.trim().replace(/^\/+/, '') || (f ? f.name : '');
  if (!path) throw new Error('اكتب مسار الملف');
  if (PROTECTED.includes(path) && !confirm('هذا ملف أساسي، هل تريد استبداله؟')) return;
  if (f) {
    if (f.size > 25 * 1024 * 1024) throw new Error('الحد الأقصى لملفات Cloudflare Pages هو 25MB');
    await putFile(path, await readB64(f), 'Upload ' + path);
  } else if (text) await putText(path, text, 'Create ' + path);
  else throw new Error('اختر ملفاً أو اكتب محتوى');
  $('#x-file').value = ''; $('#x-text').value = ''; $('#x-path').value = '';
  toast('تم الرفع'); listFiles();
});
async function listFiles() {
  const box = $('#files'); box.textContent = 'جاري التحميل…';
  try {
    const items = await gh(`contents?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`);
    box.textContent = '';
    items.forEach(it => {
      const d = document.createElement('div'); d.className = 'item';
      d.innerHTML = '<div class="u"></div>'; d.firstChild.textContent = (it.type === 'dir' ? '📁 ' : '') + it.path;
      if (it.type === 'file' && !PROTECTED.includes(it.path)) {
        const a = document.createElement('div'); a.className = 'acts';
        const b = document.createElement('button'); b.className = 'del'; b.textContent = 'حذف';
        b.onclick = () => confirm('حذف ' + it.path + '؟') && busy(b, async () => {
          await gh(`contents/${enp(it.path)}`, { method: 'DELETE', body: JSON.stringify({ message: 'Delete ' + it.path, sha: it.sha, branch: cfg.branch }) });
          toast('تم الحذف'); listFiles();
        });
        a.appendChild(b); d.appendChild(a);
      }
      box.appendChild(d);
    });
  } catch (e) { box.textContent = e.message; }
}

// ---------- التشغيل ----------
// نسخة index.html مضمّنة هنا لتُرفع تلقائياً (base64)

const DEFAULTS = {
  'links.json': '{}\n',
  'config.json': JSON.stringify({ title: 'جاري تحضير الرابط', seconds: 10, adCode: '' }, null, 2) + '\n'
};
async function ensureFiles() {
  const made = [];
  if (!(await getFile('index.html'))) { await putFile('index.html', INDEX_B64, 'Add index.html'); made.push('index.html'); }
  for (const [p, t] of Object.entries(DEFAULTS)) {
    if (!(await getFile(p))) { await putText(p, t, 'Add ' + p); made.push(p); }
  }
  if (made.length) toast('تم إنشاء الملفات تلقائياً: ' + made.join('، '));
}
$('#b-restore').onclick = e => busy(e.target, async () => {
  if (!confirm('استبدال index.html بالنسخة الأصلية من اللوحة؟')) return;
  await putFile('index.html', INDEX_B64, 'Restore index.html'); toast('تمت الاستعادة');
});

async function start() {
  $('#setup').hidden = true; $('#panel').hidden = false;
  try {
    await ensureFiles();
    const l = await getFile('links.json'); if (l) links = JSON.parse(dec(l.content));
    const c = await getFile('config.json'); if (c) site = { ...site, ...JSON.parse(dec(c.content)) };
  } catch (e) { toast(e.message, true); }
  $('#a-title').value = site.title; $('#a-sec').value = site.seconds; $('#a-code').value = site.adCode || '';
  renderLinks();
}
if (cfg) start(); else $('#setup').hidden = false;
})();
</script>
