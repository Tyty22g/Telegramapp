<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>جاري تحضير الرابط</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#121a24);--surface:var(--tg-theme-secondary-bg-color,#1b2633);--text:var(--tg-theme-text-color,#f4f6f8);--hint:var(--tg-theme-hint-color,#8c9bab);--accent:var(--tg-theme-button-color,#3fa9f5);--accent-text:var(--tg-theme-button-text-color,#fff);--ok:#4cc38a;--warn:#ffb23f;--ring:136px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 55% at 50% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.6}
.app{max-width:440px;min-height:100svh;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
.app.enter>*{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.railrow{display:flex;align-items:center;gap:12px}
.rail{flex:1;display:flex;gap:6px}
.seg{flex:1;height:6px;border-radius:6px;background:var(--surface);overflow:hidden}
.seg i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--accent);border-radius:6px;transition:width .25s linear}
.seg.done i{width:100%;background:var(--ok)}
#stepno{font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}
.head{text-align:center}
.head h1{font-size:21px;font-weight:800}
.head p{margin-top:2px;font-size:14px;color:var(--hint)}
.adwrap{position:relative}
.adtag{position:absolute;top:-9px;inset-inline-start:16px;background:var(--bg);color:var(--hint);font-size:11px;padding:0 8px;z-index:1}
.ad-slot{min-height:250px;background:var(--surface);border:1px solid color-mix(in srgb,var(--hint) 30%,transparent);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reward{width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-size:16px;font-weight:800;color:#2a1700;background:linear-gradient(135deg,#ffcf5c,#ff8f3d);box-shadow:0 6px 20px color-mix(in srgb,#ff8f3d 35%,transparent);cursor:pointer}
.reward:disabled{opacity:.6}
.timer{display:flex;justify-content:center}
.ring{position:relative;width:var(--ring);height:var(--ring);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--accent) 35%,transparent))}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:var(--surface)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:339.292;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ring .num b{font-size:46px;font-weight:800;line-height:1}
.ring .num span{font-size:12px;color:var(--hint);margin-top:4px}
.done .ring .bar{stroke:var(--ok)}
.done .ring{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ok) 40%,transparent))}
.notice{padding:12px 14px;border-radius:14px;font-size:14px;text-align:center;border:1px solid transparent}
.notice.hint{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.notice.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:color-mix(in srgb,var(--warn) 55%,transparent);animation:shake .4s}
.notice.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.go{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:16px;font-weight:800;color:var(--accent-text);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#7a5cff));cursor:pointer;transition:transform .1s}
.go:active:not(:disabled){transform:scale(.98)}
.go:disabled{background:var(--surface);color:var(--hint);cursor:not-allowed}
.go.locked{background:color-mix(in srgb,var(--warn) 25%,var(--surface));color:var(--text)}
.go:focus-visible,.reward:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.error{text-align:center;color:#ef6b6b;font-size:15px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app enter" id="app">
  <div class="railrow"><nav class="rail" id="rail" aria-label="التقدم"></nav><span id="stepno"></span></div>
  <header class="head"><h1 id="title">جاري تحضير الرابط…</h1><p id="subtitle">انتظر قليلاً</p></header>

  <!-- مساحة الإعلان تُملأ تلقائياً من لوحة الإدارة (config.json) -->
  <section class="adwrap" id="adwrap" hidden><span class="adtag">إعلان</span><div class="ad-slot" id="ad-slot" aria-label="إعلان"></div></section>

  <button class="reward" id="reward" hidden>🎁 شاهد إعلاناً مكافئاً وتخطَّ الانتظار</button>

  <div class="timer" aria-live="off">
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"></circle><circle class="bar" id="bar" cx="60" cy="60" r="54"></circle></svg>
    <div class="num"><b id="count">8</b><span>ثانية</span></div></div>
  </div>

  <div class="notice" id="notice" role="alert" hidden></div>
  <button class="go" id="go" disabled>انتظر العداد</button>
  <p class="error" id="error" hidden></p>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const els = {app:$('app'),rail:$('rail'),stepno:$('stepno'),title:$('title'),subtitle:$('subtitle'),adwrap:$('adwrap'),slot:$('ad-slot'),reward:$('reward'),count:$('count'),bar:$('bar'),notice:$('notice'),go:$('go'),error:$('error')};
const C = 2 * Math.PI * 54;
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes?.(); } catch (_) {}
  try { tg.setHeaderColor?.('bg_color'); tg.setBackgroundColor?.('bg_color'); } catch (_) {}
}
const haptic = t => { try { tg?.HapticFeedback?.notificationOccurred?.(t); } catch (_) {} };

// ===== الإعدادات الافتراضية (تُستبدل من config.json) =====
const DEFAULTS = {
  pageCount: 3, minAway: 3,
  rewarded: { sdk: '', fn: '', mode: 'interstitial' },
  pages: [
    { title: 'جاري تحضير الرابط', subtitle: 'انتظر قليلاً', seconds: 8, adCode: '', rewarded: false, require: true },
    { title: 'نفحص الرابط من أجلك', subtitle: 'تفاعل مع الإعلان لمتابعة', seconds: 8, adCode: '', rewarded: false, require: true },
    { title: 'رابطك جاهز', subtitle: 'آخر خطوة', seconds: 6, adCode: '', rewarded: false, require: true }
  ]
};
const num = (v, a, b, f) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? Math.min(b, Math.max(a, n)) : f; };
function normalize(raw) {
  const cfg = JSON.parse(JSON.stringify(DEFAULTS));
  if (!raw || typeof raw !== 'object') return cfg;
  if (Array.isArray(raw.pages) && raw.pages.length) {
    cfg.pages = cfg.pages.map((d, i) => ({ ...d, ...(raw.pages[i] || {}) }));
    cfg.pageCount = Math.round(num(raw.pageCount, 1, 3, raw.pages.length > 3 ? 3 : raw.pages.length));
  } else { // صيغة قديمة: صفحة واحدة
    cfg.pages = [{ ...DEFAULTS.pages[0], title: raw.title || DEFAULTS.pages[0].title, seconds: raw.seconds || 10, adCode: raw.adCode || '' }];
    cfg.pageCount = 1;
  }
  cfg.minAway = num(raw.minAway, 1, 30, 3);
  cfg.rewarded = { ...cfg.rewarded, ...(raw.rewarded || {}) };
  cfg.pages.forEach(p => { p.seconds = Math.round(num(p.seconds, 3, 60, 8)); p.adCode = String(p.adCode || ''); p.rewarded = !!p.rewarded; p.require = p.require !== false; });
  return cfg;
}

let config = normalize(null), targetUrl = '', idx = 0, timer = null, state = null;
const fragment = html => document.createRange().createContextualFragment(html); // ينفّذ وسوم <script>
const rewardedFn = () => { const n = (config.rewarded.fn || '').trim(); return n && typeof window[n] === 'function' ? window[n] : null; };

// ===== واجهة =====
function say(type, text) {
  els.notice.className = 'notice ' + type; els.notice.textContent = text; els.notice.hidden = false;
  void els.notice.offsetWidth;
}
function renderRail() {
  els.rail.textContent = '';
  for (let i = 0; i < config.pageCount; i++) {
    const s = document.createElement('div'); s.className = 'seg' + (i < idx ? ' done' : ''); s.appendChild(document.createElement('i')); els.rail.appendChild(s);
  }
  els.stepno.textContent = (idx + 1) + ' / ' + config.pageCount;
}
function paint() {
  const total = state.total, rem = state.remaining;
  els.count.textContent = Math.ceil(rem / 1000);
  els.bar.style.strokeDashoffset = C * (1 - rem / total);
  const seg = els.rail.children[idx]; if (seg) seg.style.setProperty('--p', 1 - rem / total);
}

// ===== منطق الصفحة =====
const page = () => config.pages[idx];
const hasBanner = () => page().adCode.trim().length > 0;
const needInteraction = () => page().require && !state.interacted && (hasBanner() || (page().rewarded && !!rewardedFn() && !state.rewardFailed));

function showPage(i) {
  idx = i; const p = page();
  clearInterval(timer);
  state = { total: p.seconds * 1000, remaining: p.seconds * 1000, interacted: false, timeUp: false, hinted: false, rewardFailed: false, rewardDone: false, leftAt: 0, lastTap: 0 };
  els.app.classList.remove('done'); els.app.classList.remove('enter'); void els.app.offsetWidth; els.app.classList.add('enter');
  els.title.textContent = p.title; els.subtitle.textContent = p.subtitle || '';
  els.slot.textContent = ''; els.notice.hidden = true;
  els.adwrap.hidden = !hasBanner();
  if (hasBanner()) { try { els.slot.appendChild(fragment(p.adCode)); } catch (e) { console.error(e); } }
  els.go.disabled = true; els.go.classList.remove('locked'); els.go.textContent = 'انتظر العداد';
  els.bar.style.strokeDasharray = C; els.bar.style.strokeDashoffset = 0;
  renderRail(); paint();
  let last = Date.now();
  timer = setInterval(() => {
    const now = Date.now(), dt = now - last; last = now;
    if (document.visibilityState === 'visible' && !state.timeUp) state.remaining = Math.max(0, state.remaining - dt);
    els.reward.hidden = !(p.rewarded && rewardedFn() && !state.rewardDone && !state.rewardFailed);
    paint();
    if (!state.hinted && !state.timeUp && state.remaining <= state.total * 0.6 && needInteraction()) {
      state.hinted = true; say('hint', 'تفاعل مع الإعلان (اضغط عليه وتصفّحه قليلاً) لتفعيل الزر بعد انتهاء العداد.');
    }
    if (state.remaining <= 0 && !state.timeUp) { state.timeUp = true; evaluate(true); }
  }, 250);
}

function evaluate(first) {
  if (!state.timeUp) return;
  if (!needInteraction()) { unlock(); return; }
  els.go.disabled = false; els.go.classList.add('locked'); els.go.textContent = 'تفاعل مع الإعلان أولاً';
  els.count.textContent = '!';
  say('warn', first ? 'لم نلاحظ تفاعلاً مع الإعلان. اضغط عليه وتصفّحه ' + config.minAway + ' ثوانٍ على الأقل ثم ارجع لمتابعة الرابط.' : 'التفاعل مع الإعلان مطلوب قبل المتابعة.');
  haptic('warning');
}
function unlock() {
  state.unlocked = true;
  els.app.classList.add('done'); els.count.textContent = '✓'; els.bar.style.strokeDashoffset = 0;
  els.go.disabled = false; els.go.classList.remove('locked');
  els.go.textContent = idx < config.pageCount - 1 ? 'التالي' : 'انتقل إلى الرابط';
  if (!state.interacted) els.notice.hidden = true;
  haptic('success');
}
els.go.onclick = () => {
  if (!state?.timeUp) return;
  if (!state.unlocked) { evaluate(false); return; }
  if (idx < config.pageCount - 1) showPage(idx + 1);
  else openTarget(targetUrl);
};
function markInteracted() {
  if (!state || state.interacted) return;
  state.interacted = true; say('ok', 'تم احتساب تفاعلك، شكراً لك!'); haptic('success'); evaluate();
}

// ===== كشف التفاعل مع الإعلان =====
els.slot.addEventListener('pointerdown', () => { if (state) state.lastTap = Date.now(); }, true);
els.slot.addEventListener('click', ev => { if (els.slot.querySelector('*') && ev.target !== els.slot) markInteracted(); }, true);
function leave() {
  if (!state || state.leftAt) return;
  const a = document.activeElement;
  const iframeClick = a && a.tagName === 'IFRAME' && els.slot.contains(a);
  if (iframeClick || Date.now() - state.lastTap < 3000) state.leftAt = Date.now();
}
function back() {
  if (!state || !state.leftAt) return;
  const away = (Date.now() - state.leftAt) / 1000; state.leftAt = 0;
  if (away >= config.minAway) markInteracted();
  else { say('warn', 'تفاعل قليل جداً. تصفّح الإعلان ' + config.minAway + ' ثوانٍ على الأقل.'); haptic('warning'); }
}
window.addEventListener('blur', leave);
window.addEventListener('focus', back);
document.addEventListener('visibilitychange', () => document.hidden ? leave() : back());
try { tg?.onEvent?.('deactivated', leave); tg?.onEvent?.('activated', back); } catch (_) {}

// ===== الإعلان المكافئ =====
els.reward.onclick = async () => {
  const fn = rewardedFn(); const p = page();
  if (!fn) { state.rewardFailed = true; say('warn', 'الإعلان المكافئ غير متاح الآن، أكمل العداد.'); evaluate(); return; }
  els.reward.disabled = true;
  try {
    await (config.rewarded.mode === 'pop' ? fn('pop') : fn());
    state.rewardDone = true; state.remaining = 0; paint();
    markInteracted();
  } catch (e) {
    state.rewardFailed = true; say('warn', 'لا يوجد إعلان مكافئ متاح حالياً، أكمل العداد.'); haptic('warning'); evaluate();
  }
  els.reward.disabled = false;
};

// ===== تحميل وتشغيل =====
const getKey = () => tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('startapp') || new URLSearchParams(location.search).get('tgWebAppStartParam') || '';
const isSafeUrl = v => { try { const u = new URL(v); return u.protocol === 'https:' || u.protocol === 'http:'; } catch (_) { return false; } };
function openTarget(url) { if (tg?.openLink) tg.openLink(url); else window.open(url, '_blank', 'noopener'); }
function fail(msg) {
  clearInterval(timer);
  els.title.textContent = 'تعذّر فتح الرابط'; els.subtitle.textContent = ''; els.error.textContent = msg; els.error.hidden = false;
  els.count.textContent = '!'; els.bar.style.strokeDashoffset = C; els.go.textContent = 'الرابط غير متاح'; els.go.disabled = true; els.adwrap.hidden = true; els.reward.hidden = true;
}
async function loadJson(file) {
  const r = await fetch(file + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function init() {
  try { config = normalize(await loadJson('config.json')); } catch (_) { config = normalize(null); }
  if (config.rewarded.sdk && config.rewarded.sdk.trim()) { try { document.body.appendChild(fragment(config.rewarded.sdk)); } catch (_) {} }
  const key = getKey();
  if (!key) { showPage(0); fail('افتح هذه الصفحة من رابط مختصر صحيح.'); return; }
  try {
    const links = await loadJson('links.json');
    const url = Object.prototype.hasOwnProperty.call(links, key) ? links[key] : null;
    if (!url) { showPage(0); fail('هذا الرابط غير موجود أو تم حذفه.'); return; }
    if (!isSafeUrl(url)) { showPage(0); fail('الرابط المخزّن غير صالح.'); return; }
    targetUrl = url; showPage(0);
  } catch (e) { console.error(e); showPage(0); fail('حدث خطأ أثناء تحميل الروابط. حاول مرة أخرى.'); }
}
init();
})();
</script>
</body>
</html>
