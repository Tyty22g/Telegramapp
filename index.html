<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جارٍ تحضير الرابط</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="head">
      <h1 id="title">جارٍ تحضير الرابط…</h1>
      <p id="subtitle">انتظر قليلاً قبل الانتقال.</p>
    </header>

    <!-- ضع كود شبكة الإعلانات هنا (Monetag / بنر) -->
    <section class="ad-slot" id="ad-slot">
      مساحة الإعلان
    </section>

    <section class="timer">
      <div class="ring">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <circle class="track" cx="48" cy="48" r="42"></circle>
          <circle class="bar" id="bar" cx="48" cy="48" r="42"></circle>
        </svg>
        <div id="count" aria-live="polite">10</div>
      </div>
      <p id="status">يرجى الانتظار حتى انتهاء العد التنازلي</p>
    </section>

    <button id="go" disabled>انتقل إلى الرابط</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
