<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex"><title>جاري التحضير</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;800;900&display=swap" rel="stylesheet">
<style>
:root{--ac:#2a2fd9}*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}body{background:var(--ac);color:#fff;font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
#bar{position:fixed;top:0;inset-inline:0;height:5px;background:#fff3}#bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 26px;max-width:520px;width:100%;margin:0 auto}
#dots{display:flex;gap:6px;margin-bottom:auto;padding-top:34px}#dots b{height:6px;flex:1;border-radius:3px;background:#fff3}#dots b.on{background:#fff}
#num{font-size:min(46vw,210px);font-weight:900;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:auto}
h1{font-size:26px;font-weight:800;margin-top:14px}p{opacity:.75;margin-top:4px}
#mid{margin-top:18px}
#go{display:none;margin:22px 0 auto;border:0;border-radius:18px;background:#fff;color:var(--ac);font:inherit;font-weight:900;font-size:20px;padding:18px;cursor:pointer;width:100%}
#go:active{transform:scale(.98)}
#foot{background:#fff;color:#111;text-align:center}
@media(prefers-reduced-motion:no-preference){#num.t{animation:p .35s}@keyframes p{from{transform:translateY(8px);opacity:.4}}}
</style></head><body>
<div id="bar"><i></i></div>
<main><div id="dots"></div><div id="num"></div><h1 id="ttl">لحظات…</h1><p id="sub"></p><div id="mid"></div><button id="go">فتح الرابط</button></main>
<div id="foot"></div>
<script>
(async()=>{
const tg=window.Telegram&&window.Telegram.WebApp;try{tg.ready();tg.expand()}catch(_){}
const $=i=>document.getElementById(i),Q=new URLSearchParams(location.search);
const key=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||Q.get('startapp')||Q.get('tgWebAppStartParam')||'';
const J=f=>fetch(f+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());
let c={},L={};try{c=await J('config.json')}catch(_){}
const st=Array.isArray(c.steps)&&c.steps.length?c.steps:Array.isArray(c.pages)&&c.pages.length?c.pages.slice(0,c.pageCount||c.pages.length).map(p=>({t:p.title,s:p.seconds})):[{t:'نجهّز رابطك',s:6},{t:'نفحص الرابط',s:6},{t:'رابطك جاهز',s:5}];
const ac=(c.accent||(c.theme&&c.theme.accent)||'');if(/^#[0-9a-f]{6}$/i.test(ac))document.documentElement.style.setProperty('--ac',ac);
const uid=String(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:'');window.TG_USER_ID=uid;
const inj=(h,host)=>{if(!h)return;const t=document.createElement('template');t.innerHTML=h.replace(/\{\{TG_USER_ID\}\}/g,uid);t.content.querySelectorAll('script').forEach(o=>{const n=document.createElement('script');[...o.attributes].forEach(a=>n.setAttribute(a.name,a.value));n.text=o.text;o.replaceWith(n)});host.appendChild(t.content)};
inj(c.head,document.head);inj(c.mid,$('mid'));inj(c.foot,$('foot'));
const fail=m=>{$('num').textContent='✕';$('ttl').textContent=m;$('sub').textContent='تأكد من الرابط أو اطلب رابطاً جديداً'};
if(!key)return fail('الرابط غير مكتمل');
try{L=await J('links.json')}catch(_){return fail('تعذّر تحميل الرابط')}
const url=L[key];if(!/^https?:\/\//i.test(url||''))return fail('الرابط غير موجود أو محذوف');
$('dots').innerHTML=st.map(()=>'<b></b>').join('');const D=$('dots').children,bar=$('bar').firstChild;
const total=st.reduce((a,s)=>a+s.s,0);let done=0;
const run=(s,i)=>new Promise(ok=>{let left=s*1000,last=performance.now(),shown=0;[...D].forEach((d,j)=>d.classList.toggle('on',j<=i));$('ttl').textContent=st[i].t;$('sub').textContent='الخطوة '+(i+1)+' من '+st.length;
const iv=setInterval(()=>{const n=performance.now();if(!document.hidden)left-=n-last;last=n;const sec=Math.max(0,Math.ceil(left/1000));
if(sec!==shown){shown=sec;$('num').textContent=sec;$('num').classList.remove('t');void $('num').offsetWidth;$('num').classList.add('t')}
bar.style.width=Math.min(100,(done+(s*1000-Math.max(left,0)))/(total*1000)*100)+'%';
if(left<=0){clearInterval(iv);done+=s*1000;ok()}},100)});
for(let i=0;i<st.length;i++)await run(Math.min(60,Math.max(3,+st[i].s||6)),i);
$('num').textContent='✓';$('ttl').textContent='رابطك جاهز';$('sub').textContent='اضغط للمتابعة';$('go').style.display='block';
$('go').onclick=()=>{try{tg&&tg.openLink?tg.openLink(url):window.open(url,'_blank','noopener')}catch(_){location.href=url}};
})();
</script></body></html>
