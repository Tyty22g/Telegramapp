<style>

.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ring .num b{font-size:46px;font-weight:800;line-height:1}

.done .ring .bar{stroke:var(--ok)}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const els = {app:$('app'),rail:$('rail'),stepno:$('stepno'),title:$('title'),subtitle:$('subtitle'),adwrap:$('adwrap'),slot:$('ad-slot'),reward:$('reward'),count:$('count'),bar:$('bar'),notice:$('notice'),go:$('go'),error:$('error'),dest:$('dest'),ring:document.querySelector('.ring'),pfill:$('pfill')};
const C = 2 * Math.PI * 54;
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes?.(); } catch (_) {}
  try { tg.setHeaderColor?.('bg_color'); tg.setBackgroundColor?.('bg_color'); } catch (_) {}
}
const haptic = t => { try { tg?.HapticFeedback?.notificationOccurred?.(t); } catch (_) {} };

// ===== الإعدادات الافتراضية (تُستبدل من config.json) =====
const DEFAULTS = {
  pageCount: 3, minAway: 3,
  theme: { accent: '', fx: 'slide', confetti: true, counter: 'ring' },
  ads: [],
  about: { name: 'Xtreme Links', desc: 'خدمة مجانية لفتح الروابط بشكل آمن وسريع داخل تيليجرام. افتح الرابط الذي وصلك، انتظر ثوانٍ قليلة، وسيُفتح الرابط الأصلي مباشرة.', contact: '', bot: '', app: '' },
  rewarded: { provider: 'adsgram', blockId: '', sdk: '', fn: '', mode: 'interstitial', fallbackSdk: '', fallbackFn: '', offerAfter: 0, skipAll: false, passMinutes: 0, text: '🎁 شاهد إعلاناً ووفّر {s} ثانية' },
  pages: [
    { title: 'جاري تحضير الرابط', subtitle: 'انتظر قليلاً', seconds: 8, adCode: '', rewarded: true, require: false },
    { title: 'نفحص الرابط من أجلك', subtitle: 'انتظر قليلاً', seconds: 8, adCode: '', rewarded: true, require: false },
    { title: 'رابطك جاهز', subtitle: 'آخر خطوة', seconds: 6, adCode: '', rewarded: true, require: false }
  ]
};
const num = (v, a, b, f) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? Math.min(b, Math.max(a, n)) : f; };
const MAXP = 20;
function normalize(raw) {
  const cfg = JSON.parse(JSON.stringify(DEFAULTS));
  const tpl = DEFAULTS.pages[DEFAULTS.pages.length - 1];
  if (raw && typeof raw === 'object') {
    const src = Array.isArray(raw.pages) && raw.pages.length ? raw.pages.slice(0, MAXP) : [{ ...tpl, title: raw.title || tpl.title, seconds: raw.seconds || 10, adCode: raw.adCode || '' }];
    cfg.pageCount = Math.round(num(raw.pageCount, 1, MAXP, Array.isArray(raw.pages) && raw.pages.length ? src.length : 1));
    cfg.pages = src.map((p, i) => ({ ...(DEFAULTS.pages[i] || tpl), ...p }));
    cfg.minAway = num(raw.minAway, 1, 30, 3);
    cfg.about = { ...cfg.about, ...(raw.about || {}) };
    cfg.theme = { ...cfg.theme, ...(raw.theme || {}) };
    cfg.ads = Array.isArray(raw.ads) ? raw.ads : [];
    cfg.rewarded = { ...cfg.rewarded, ...(raw.rewarded || {}) };
  }
  while (cfg.pages.length < cfg.pageCount) cfg.pages.push({ ...tpl });
  cfg.minAway = Math.round(cfg.minAway);
  { const r = cfg.rewarded; r.offerAfter = Math.min(60, Math.max(0, Math.round(Number(r.offerAfter) || 0))); r.skipAll = !!r.skipAll; r.text = String(r.text || '').slice(0, 120) || '🎁 شاهد إعلاناً ووفّر {s} ثانية'; }
  { const t = cfg.theme = { accent: '', fx: 'slide', confetti: true, ...(cfg.theme || {}) }; t.accent = /^#[0-9a-f]{6}$/i.test(t.accent) ? t.accent : ''; if (!['slide','fade','zoom','flip','blur'].includes(t.fx)) t.fx = 'slide'; t.confetti = t.confetti !== false; if (!['ring','bar','pulse','liquid','orbit'].includes(t.counter)) t.counter = 'ring'; cfg.rewarded.passMinutes = Math.min(1440, Math.max(0, Math.round(Number(cfg.rewarded.passMinutes) || 0))); }
  cfg.ads = (Array.isArray(cfg.ads) ? cfg.ads : []).slice(0, 200).map((u, i) => ({ id: String(u.id || 'u' + i).replace(/[^\w-]/g, '').slice(0, 40) || 'u' + i, name: String(u.name || '').slice(0, 60), type: ['banner','popup','rewarded'].includes(u.type) ? u.type : 'banner', code: String(u.code || '').slice(0, 20000), fn: String(u.fn || '').trim().slice(0, 80), pages: String(u.pages || 'all').slice(0, 100), cap: ['once','session','minutes'].includes(u.cap) ? u.cap : 'once', capMin: Math.min(1440, Math.max(1, Math.round(Number(u.capMin) || 30))), on: u.on !== false })).filter(u => u.on);
  cfg.pages.forEach(p => { p.seconds = Math.round(num(p.seconds, 3, 60, 8)); p.adCode = String(p.adCode || ''); p.rewarded = !!p.rewarded; p.require = p.require !== false; });
  return cfg;
}

let config = normalize(null), targetUrl = '', idx = 0, timer = null, state = null;
const fragment = html => document.createRange().createContextualFragment(html); // ينفّذ وسوم <script>
let adsgramCtl = null, adsgramId = '', passAll = false;
const resolveFn = path => { try { const f = String(path || '').trim().split('.').reduce((o, k) => (o == null ? o : o[k]), window); return typeof f === 'function' ? f : null; } catch (_) { return null; } };
const cleanBlock = v => { const s = String(v || '').trim(); return /^(int-|task-)?\d+$/i.test(s) ? s : ''; };
const runners = () => {
  const r = config.rewarded, list = [];
  if (r.provider === 'adsgram') {
    const id = cleanBlock(r.blockId);
    if (id && window.Adsgram) list.push(() => {
      if (!adsgramCtl || adsgramId !== id) { adsgramCtl = window.Adsgram.init({ blockId: id, debug: false }); adsgramId = id; }
      return adsgramCtl.show();
    });
  } else { const f = resolveFn(r.fn); if (f) list.push(() => (r.mode === 'pop' ? f('pop') : f())); }
  const fb = resolveFn(r.fallbackFn); if (fb) list.push(() => fb());
  unitsFor('rewarded').forEach(u => { const f = resolveFn(u.fn); if (f) list.push(() => f()); });
  return list;
};
const rewardedFn = () => (runners().length ? true : null);
const loadScript = tag => { try { document.body.appendChild(fragment(tag)); } catch (_) {} };

// ===== واجهة =====
function say(type, text) {
  els.notice.className = 'notice ' + type; els.notice.textContent = text; els.notice.hidden = false;
  void els.notice.offsetWidth;
}
function renderRail() {
  els.rail.textContent = '';
  for (let i = 0; i < config.pageCount; i++) {
    const s = document.createElement('div'); s.className = 'seg' + (i < idx ? ' done' : ''); s.appendChild(document.createElement('i')); els.rail.appendChild(s);
  }
  els.stepno.textContent = (idx + 1) + ' / ' + config.pageCount;
  try { window.__onStep && window.__onStep(idx + 1); } catch (_) {} /*STEPINJ*/
}
function paint() {
  const total = state.total, rem = state.remaining;
  els.count.textContent = Math.ceil(rem / 1000);
  els.bar.style.strokeDashoffset = C * (1 - rem / total);
  els.ring.style.setProperty('--prog', 1 - rem / total); els.pfill.style.width = (100 * (1 - rem / total)) + '%';
  const seg = els.rail.children[idx]; if (seg) seg.style.setProperty('--p', 1 - rem / total);
  { const p = 1 - rem / total, L = document.getElementById('chk'); if (L) [...L.children].forEach((x, i) => { const t = (i + 1) / 3; x.className = p >= t - 0.0001 ? 'ok' : (p >= t - 1 / 3 ? 'cur' : ''); }); }
}

// ===== منطق الصفحة =====
const page = () => config.pages[idx];
const unitsFor = type => config.ads.filter(u => u.type === type && (u.pages === 'all' || u.pages.split(/[,\s]+/).includes(String(idx + 1))));
const capOk = u => { try { const v = (u.cap === 'session' ? sessionStorage : localStorage).getItem('pop_' + u.id); return !v || (u.cap === 'minutes' && Date.now() - +v > u.capMin * 60000); } catch (_) { return true; } };
const capMark = u => { try { (u.cap === 'session' ? sessionStorage : localStorage).setItem('pop_' + u.id, String(Date.now())); } catch (_) {} };
document.addEventListener('pointerdown', ev => {
  if (!state || state.popDone || (ev.target.closest && ev.target.closest('#reward'))) return;
  state.popDone = true;
  unitsFor('popup').forEach(u => { if (!capOk(u)) return; capMark(u); try { document.body.appendChild(fragment(u.code)); } catch (e) { console.error(e); } });
}, true);
const hasBanner = () => page().adCode.trim().length > 0 || unitsFor('banner').length > 0;
const needInteraction = () => page().require && !state.interacted && (hasBanner() || (page().rewarded && !!rewardedFn() && !state.rewardFailed));

const applyTheme = () => {
  const t = config.theme || {};
  if (t.accent) document.documentElement.style.setProperty('--accent', t.accent);
  els.app.dataset.fx = t.fx || 'slide'; els.app.dataset.counter = t.counter || 'ring';
  [...els.app.children].forEach((c, i) => c.style.setProperty('--i', i));
};
const goTo = i => { els.app.classList.add('leave'); setTimeout(() => { els.app.classList.remove('leave'); showPage(i); }, 230); };
const burst = () => {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = ['#ffcf5c', '#3fa9f5', '#7a5cff', '#42d392', '#ff6b8b'];
  for (let k = 0; k < 44; k++) {
    const s = document.createElement('span'); s.className = 'cf';
    s.style.cssText = 'left:' + Math.random() * 100 + 'vw;background:' + cols[k % 5] + ';--x:' + (Math.random() * 120 - 60) + 'px;--r:' + (Math.random() * 900 - 450) + 'deg;--d:' + (1.8 + Math.random() * 1.6) + 's;animation-delay:' + Math.random() * .4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4200);
  }
};
const passValid = () => { try { return +localStorage.getItem('rwpass') > Date.now(); } catch (_) { return false; } };
const savePass = () => { try { const m = config.rewarded.passMinutes; if (m > 0) localStorage.setItem('rwpass', String(Date.now() + m * 60000)); } catch (_) {} };
function syncReward(p) {
  const rw = config.rewarded, elapsed = state.total - state.remaining;
  const can = (p.rewarded || unitsFor('rewarded').length > 0) && rewardedFn() && !state.rewardDone && !state.rewardFailed;
  els.reward.hidden = !(can && elapsed >= rw.offerAfter * 1000);
  const s = Math.ceil(state.remaining / 1000), t = rw.text.replace('{s}', s > 0 ? s : '');
  if (els.reward.textContent !== t) els.reward.textContent = t;
}
function showPage(i) {
  idx = i; const p = page(); applyTheme(); els.dest.hidden = true;
  clearInterval(timer);
  state = { total: p.seconds * 1000, remaining: p.seconds * 1000, interacted: false, timeUp: false, hinted: false, rewardFailed: false, rewardDone: false, leftAt: 0, lastTap: 0 };
  els.app.classList.remove('done'); els.app.classList.remove('enter'); void els.app.offsetWidth; els.app.classList.add('enter');
  els.title.textContent = p.title; els.subtitle.textContent = p.subtitle || '';
  els.slot.textContent = ''; els.notice.hidden = true;
  els.adwrap.hidden = !hasBanner(); state.popDone = false;
  if (hasBanner()) {
    const add = code => { try { const w = document.createElement('div'); w.className = 'ad-unit'; w.appendChild(fragment(code)); els.slot.appendChild(w); } catch (e) { console.error(e); } };
    if (p.adCode.trim()) add(p.adCode);
    unitsFor('banner').forEach(u => add(u.code));
  }
  els.go.disabled = true; els.go.classList.remove('locked'); els.go.textContent = 'انتظر العداد';
  els.bar.style.strokeDasharray = C; els.bar.style.strokeDashoffset = 0;
  if (passAll || passValid()) { passAll = true; state.remaining = 0; state.rewardDone = true; state.interacted = true; }
  renderRail(); paint();
  if (passAll) say('ok', 'تم تخطي الانتظار بفضل الإعلان المكافئ ✓');
  let last = Date.now();
  timer = setInterval(() => {
    const now = Date.now(), dt = now - last; last = now;
    if (document.visibilityState === 'visible' && !state.timeUp) state.remaining = Math.max(0, state.remaining - dt);
    syncReward(p);
    paint();
    if (!state.hinted && !state.timeUp && state.remaining <= state.total * 0.6 && needInteraction()) {
      state.hinted = true; say('hint', 'تفاعل مع الإعلان (اضغط عليه وتصفّحه قليلاً) لتفعيل الزر بعد انتهاء العداد.');
    }
    if (state.remaining <= 0 && !state.timeUp) { state.timeUp = true; evaluate(true); }
  }, 250);
}

function evaluate(first) {
  if (!state.timeUp) return;
  if (!needInteraction()) { unlock(); return; }
  els.go.disabled = false; els.go.classList.add('locked'); els.go.textContent = 'تفاعل مع الإعلان أولاً';
  els.count.textContent = '!';
  say('warn', first ? 'لم نلاحظ تفاعلاً مع الإعلان. اضغط عليه وتصفّحه ' + config.minAway + ' ثوانٍ على الأقل ثم ارجع لمتابعة الرابط.' : 'التفاعل مع الإعلان مطلوب قبل المتابعة.');
  haptic('warning');
}
function unlock() {
  state.unlocked = true;
  els.app.classList.add('done'); els.count.textContent = '✓'; els.bar.style.strokeDashoffset = 0;
  els.go.disabled = false; els.go.classList.remove('locked');
  els.go.textContent = idx < config.pageCount - 1 ? 'التالي' : 'انتقل إلى الرابط';
  if (!state.interacted) els.notice.hidden = true;
  haptic('success');
  if (idx === config.pageCount - 1) {
    if (config.theme.confetti) burst();
    try { els.dest.textContent = 'الوجهة: ' + new URL(targetUrl).host; els.dest.hidden = false; } catch (_) {}
  }
}
els.go.onclick = () => {
  if (!state?.timeUp) return;
  if (!state.unlocked) { evaluate(false); return; }
  if (idx < config.pageCount - 1) goTo(idx + 1);
  else openTarget(targetUrl);
};
function markInteracted() {
  if (!state || state.interacted) return;
  state.interacted = true; say('ok', 'تم احتساب تفاعلك، شكراً لك!'); haptic('success'); evaluate();
}

// ===== كشف التفاعل مع الإعلان =====
els.slot.addEventListener('pointerdown', () => { if (state) state.lastTap = Date.now(); }, true);
els.slot.addEventListener('click', ev => { if (els.slot.querySelector('*') && ev.target !== els.slot) markInteracted(); }, true);
function leave() {
  if (!state || state.leftAt) return;
  const a = document.activeElement;
  const iframeClick = a && a.tagName === 'IFRAME' && els.slot.contains(a);
  if (iframeClick || Date.now() - state.lastTap < 3000) state.leftAt = Date.now();
}
function back() {
  if (!state || !state.leftAt) return;
  const away = (Date.now() - state.leftAt) / 1000; state.leftAt = 0;
  if (away >= config.minAway) markInteracted();
  else { say('warn', 'تفاعل قليل جداً. تصفّح الإعلان ' + config.minAway + ' ثوانٍ على الأقل.'); haptic('warning'); }
}
window.addEventListener('blur', leave);
window.addEventListener('focus', back);
document.addEventListener('visibilitychange', () => document.hidden ? leave() : back());
try { tg?.onEvent?.('deactivated', leave); tg?.onEvent?.('activated', back); } catch (_) {}

// ===== الإعلان المكافئ =====
els.reward.onclick = async () => {
  const list = runners();
  if (!list.length) { state.rewardFailed = true; say('warn', 'الإعلان المكافئ غير متاح الآن، أكمل العداد.'); evaluate(); return; }
  els.reward.disabled = true;
  let ok = false, skipped = false;
  for (const run of list) {
    try { await run(); ok = true; break; }
    catch (e) {
      console.warn('Rewarded ad error:', e && (e.description || e.message || e));
      if (e && e.error === false && e.done === false) { skipped = true; break; } // تخطّى الإعلان قبل نهايته
    }
  }
  if (ok) { if (config.rewarded.skipAll) passAll = true; savePass(); state.rewardDone = true; state.remaining = 0; paint(); markInteracted(); }
  else if (skipped) { say('warn', 'لازم تكمل مشاهدة الإعلان للحصول على المكافأة.'); haptic('warning'); }
  else { state.rewardFailed = true; say('warn', 'لا يوجد إعلان مكافئ متاح حالياً، أكمل العداد.'); haptic('warning'); evaluate(); }
  els.reward.disabled = false;
};

// ===== تحميل وتشغيل =====
const getKey = () => tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('startapp') || new URLSearchParams(location.search).get('tgWebAppStartParam') || '';
const isSafeUrl = v => { try { const u = new URL(v); return u.protocol === 'https:' || u.protocol === 'http:'; } catch (_) { return false; } };
function openTarget(url) { if (tg?.openLink) tg.openLink(url); else window.open(url, '_blank', 'noopener'); }
function fail(msg) {
  clearInterval(timer);
  els.title.textContent = 'تعذّر فتح الرابط'; els.subtitle.textContent = ''; els.error.textContent = msg; els.error.hidden = false;
  els.count.textContent = '!'; els.bar.style.strokeDashoffset = C; els.go.textContent = 'الرابط غير متاح'; els.go.disabled = true; els.adwrap.hidden = true; els.reward.hidden = true;
}
async function loadJson(file) {
  const r = await fetch(file + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function el(t, txt, cls) { const e = document.createElement(t); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; }
function card(title, node) { const c = el('div', '', 'card'); c.appendChild(el('h2', title)); c.appendChild(node); return c; }
function list(tag, items) { const l = el(tag); items.forEach(i => l.appendChild(el('li', i))); return l; }
function buildAbout(canBack) {
  const a = config.about, box = $('about'); box.textContent = '';
  box.appendChild(el('h1', a.name || 'عن التطبيق')); box.appendChild(el('p', a.desc, 'lead'));
  box.appendChild(card('كيف يعمل؟', list('ol', ['تصلك رسالة تحتوي على رابط مختصر من البوت.', 'تفتح الرابط فتظهر صفحات انتظار قصيرة.', 'بعد انتهاء العداد يُفتح الرابط الأصلي.'])));
  box.appendChild(card('المميزات', list('ul', ['مجاني بالكامل', 'سريع وبدون تسجيل', 'يعمل داخل تيليجرام مباشرة'])));
  box.appendChild(card('أماكن عرض الإعلانات', list('ul', ['إعلان ثابت داخل صفحة الانتظار فوق زر الفتح.', 'إعلان ثابت أسفل الشاشة ويمكن إغلاقه.', 'إعلان مكافأة اختياري بزر «شاهد إعلاناً»، ولا يلزم لفتح الرابط.'])));
  { const rn = runners(); if (rn.length) { const db = el('button', 'شاهد إعلاناً لدعم الخدمة (اختياري)', 'go'); db.onclick = () => { Promise.resolve().then(() => rn[0]()).catch(() => {}); }; box.appendChild(db); } }
  box.appendChild(card('الإعلانات والخصوصية', el('p', 'يعرض التطبيق إعلانات لدعم الخدمة، وقد تُعرض إعلانات مكافئة اختيارية. لا نطلب أي بيانات شخصية ولا نخزّنها.', 'lead')));
  const bot = String(a.bot || '').replace(/^@/, '').trim();
  if (/^[A-Za-z0-9_]{3,64}$/.test(bot)) {
    const url = 'https://t.me/' + bot + (/^[A-Za-z0-9_]{1,64}$/.test(a.app || '') ? '/' + a.app : '');
    const bb = el('button', 'افتح البوت @' + bot, 'go'); bb.onclick = () => { if (tg?.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank', 'noopener'); };
    box.appendChild(bb);
  }
  if (a.contact) box.appendChild(el('small', 'للتواصل: ' + a.contact));
  if (canBack) { const b = el('button', 'رجوع', 'go'); b.onclick = () => { els.app.classList.remove('aboutmode'); }; box.appendChild(b); }
  box.hidden = false;
}
$('aboutlink').onclick = () => { buildAbout(!!targetUrl); els.app.classList.add('aboutmode'); window.scrollTo(0, 0); };

const cleanInject = a => (Array.isArray(a) ? a : []).slice(0, 50).map(u => ({
  where: u && u.where === 'body' ? 'body' : 'head',
  pages: /^(all|[\d,\s]+)$/i.test(String((u && u.pages) || 'all').trim()) ? String((u && u.pages) || 'all').trim().toLowerCase() : 'all',
  target: u && ['go', 'app'].includes(u.target) ? u.target : 'both',
  code: String((u && u.code) || '').slice(0, 50000),
  on: !(u && u.on === false)
})).filter(u => u.on && u.code.trim());
const tgUid = () => { try { return String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id || ''); } catch (_) { return ''; } };
async function runInject(list, page) {
  window.TG_USER_ID = tgUid();
  for (const u of list) {
    if (u.target !== 'both' && u.target !== page) continue;
    const host = u.where === 'body' ? document.body : document.head;
    const t = document.createElement('template'); t.innerHTML = u.code.replace(/\{\{TG_USER_ID\}\}/g, tgUid());
    for (const n of [...t.content.childNodes]) {
      if (n.nodeName !== 'SCRIPT') { try { host.appendChild(document.importNode(n, true)); } catch (_) {} continue; }
      const sc = document.createElement('script');
      for (const a of n.attributes) sc.setAttribute(a.name, a.value);
      if (n.getAttribute('src')) {
        sc.async = false;
        await new Promise(ok => { sc.onload = sc.onerror = ok; host.appendChild(sc); setTimeout(ok, 8000); });
      } else {
        sc.text = n.textContent;
        const orig = document.addEventListener;
        document.addEventListener = function (type, fn, o) {
          if (type === 'DOMContentLoaded' && document.readyState === 'loading') return orig.call(this, type, fn, o);
          if (type === 'DOMContentLoaded') { setTimeout(() => { try { fn.call(document, new Event('DOMContentLoaded')); } catch (e) { console.error(e); } }, 0); return; }
          return orig.call(this, type, fn, o);
        };
        try { host.appendChild(sc); } catch (e) { console.error(e); }
        document.addEventListener = orig;
      }
    }
  }
}
async function init() {
  let rawCfg = null;
  try { rawCfg = await loadJson('config.json'); config = normalize(rawCfg); } catch (_) { config = normalize(null); }
  const injList = cleanInject(rawCfg && rawCfg.inject), injDone = new Set();
  runInject(injList.filter(u => u.pages === 'all'), 'go');
  window.__onStep = n => {
    const due = injList.filter(u => u.pages !== 'all' && !injDone.has(u) && u.pages.split(/[,\s]+/).includes(String(n)));
    due.forEach(u => injDone.add(u)); if (due.length) runInject(due, 'go');
  };
  window.__onStep(idx + 1);
  const rw = config.rewarded;
  if (rw.provider === 'adsgram') {
    if (cleanBlock(rw.blockId)) { const sc = document.createElement('script'); sc.src = 'https://sad.adsgram.ai/js/sad.min.js'; sc.async = true; document.head.appendChild(sc); }
  } else if (rw.sdk && rw.sdk.trim()) loadScript(rw.sdk);
  if (rw.fallbackSdk && rw.fallbackSdk.trim()) loadScript(rw.fallbackSdk);
  config.ads.filter(u => u.type === 'rewarded' && u.code.trim()).forEach(u => loadScript(u.code));
  const key = getKey();
  if (!key) { buildAbout(false); els.app.classList.add('aboutmode'); return; }
  try {
    const links = await loadJson('links.json');
    const url = Object.prototype.hasOwnProperty.call(links, key) ? links[key] : null;
    if (!url) { showPage(0); fail('هذا الرابط غير موجود أو تم حذفه.'); return; }
    if (!isSafeUrl(url)) { showPage(0); fail('الرابط المخزّن غير صالح.'); return; }
    targetUrl = url; showPage(0);
  } catch (e) { console.error(e); showPage(0); fail('حدث خطأ أثناء تحميل الروابط. حاول مرة أخرى.'); }
}
init();

(function(){
  const inAbout=()=>els.app.classList.contains('aboutmode');
  const closeAbout=()=>{ if(targetUrl){ els.app.classList.remove('aboutmode'); window.scrollTo(0,0); } else if(tg?.close) tg.close(); else history.back(); };
  const sync=()=>{ try{ const b=tg?.BackButton; if(!b) return; inAbout()?b.show():b.hide(); }catch(_){} };
  $('xclose').onclick=closeAbout;
  try{ tg?.BackButton?.onClick(()=>{ closeAbout(); sync(); }); }catch(_){}
  new MutationObserver(sync).observe(els.app,{attributes:true,attributeFilter:['class']});
  sync();
})();
})();
